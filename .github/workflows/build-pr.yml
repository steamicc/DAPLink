# Compiles the release targets on every pull request.
# The job name "compiler" is the required status check of the repository
# ruleset: do not rename it, and do not add a matrix (it would rename the check).

name: Build PR

on:
  pull_request:
    branches: [ release_letssteam ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: compiler
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python 3.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"

    # The toolchain version and the target list are read from generate_release.yml,
    # the single source of truth, so that both workflows never diverge.
    - name: Read the release targets
      id: cibles
      run: |
        gcc=$(grep -oE "gcc: \['[^']+'\]" .github/workflows/generate_release.yml | grep -oE "[0-9][^']*" || true)
        [ -n "$gcc" ] || { echo "::error::No gcc version found in generate_release.yml"; exit 1; }
        cibles=$(grep -oE 'progen_compile\.py -t make_gcc_arm --clean --parallel [a-z0-9_]+' \
                   .github/workflows/generate_release.yml | awk '{print $NF}' || true)
        [ -n "$cibles" ] || { echo "::error::No target found in generate_release.yml"; exit 1; }
        echo "gcc=$gcc" >> "$GITHUB_OUTPUT"
        {
          echo "cibles<<EOF"
          echo "$cibles"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "gcc: $gcc"
        echo "targets:"
        echo "$cibles"

    - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: ${{ steps.cibles.outputs.gcc }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        arm-none-eabi-gcc --version

    # No stamping step: without steami_release_ci.h the build uses release 0.
    - name: Build the release targets
      env:
        CIBLES: ${{ steps.cibles.outputs.cibles }}
      run: |
        for cible in $CIBLES; do
          echo "::group::$cible"
          python tools/progen_compile.py -t make_gcc_arm --clean --parallel "$cible"
          echo "::endgroup::"
        done
