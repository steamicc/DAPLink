# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Generate Release

on:
  push:
    branches: [ release_letssteam ]
    # Release only when a push can change the firmware. When in doubt, release.
    # Workflow/CI changes never release. After changing the gcc version or the
    # target list in this workflow, start a release by hand (Actions >
    # Generate Release > Run workflow): workflow_dispatch still works.
    paths:
      - 'source/**'
      - 'records/**'
      - 'projects.yaml'
      - 'tools/**'
      - 'requirements.txt'
      - 'mbed-os.lib'
      - '.gitattributes'
  workflow_dispatch:

# A release in progress is never cancelled.
concurrency:
  group: generate-release
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        gcc: ['10.3-2021.10']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.10
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"

    - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: ${{ matrix.gcc }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        arm-none-eabi-gcc --version
        
    - name: Set release name, number and date
      run: |
        day=$(date -u +'%Y-%m-%d')
        echo "RELEASE_NAME=${day}.${{ github.run_number }}" >> $GITHUB_ENV
        echo "RELEASE_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
        echo "RELEASE_DATE=${day//-/}" >> $GITHUB_ENV

    # Untracked on purpose: rewriting steami_release.h would make DETAILS.TXT
    # report "Local Mods: 1".
    - name: Stamp the STeaMi build with the release number and date
      run: |
        f=source/board/steami/steami_release_ci.h
        printf '#define STEAMI_RELEASE_NUMBER %su\n#define STEAMI_RELEASE_DATE %su\n' "$RELEASE_NUMBER" "$RELEASE_DATE" > "$f"
        cat "$f"
        grep -qx "#define STEAMI_RELEASE_NUMBER ${RELEASE_NUMBER}u" "$f"
        grep -qx "#define STEAMI_RELEASE_DATE ${RELEASE_DATE}u" "$f"
        git diff --quiet --exit-code

    - name: Compile stm32f103xb_bl
      run: |
        python tools/progen_compile.py -t make_gcc_arm --clean --parallel stm32f103xb_bl
        
    - name: Compile stm32f103xb_stm32wb55rg_if
      run: |
        python tools/progen_compile.py -t make_gcc_arm --clean --parallel stm32f103xb_stm32wb55rg_if
        
    - name: Compile stm32f103xb_stm32l475vg_if
      run: |
        python tools/progen_compile.py -t make_gcc_arm --clean --parallel stm32f103xb_stm32l475vg_if
        
    - name: Compile stm32f103xb_steami32_if
      run: |
        python tools/progen_compile.py -t make_gcc_arm --clean --parallel stm32f103xb_steami32_if
        

    - name: Generate Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ env.RELEASE_NAME }}
        tag_name: ${{ env.RELEASE_NAME }}
        prerelease: false
        make_latest: true
        files: |
          projectfiles/make_gcc_arm/stm32f103xb_bl/build/stm32f103xb_bl.bin
          projectfiles/make_gcc_arm/stm32f103xb_bl/build/stm32f103xb_bl_crc.bin
          projectfiles/make_gcc_arm/stm32f103xb_bl/build/stm32f103xb_bl_crc.txt
          projectfiles/make_gcc_arm/stm32f103xb_stm32wb55rg_if/build/stm32f103xb_stm32wb55rg_if.bin
          projectfiles/make_gcc_arm/stm32f103xb_stm32wb55rg_if/build/stm32f103xb_stm32wb55rg_if_crc.bin
          projectfiles/make_gcc_arm/stm32f103xb_stm32wb55rg_if/build/stm32f103xb_stm32wb55rg_if_crc.txt
          projectfiles/make_gcc_arm/stm32f103xb_stm32l475vg_if/build/stm32f103xb_stm32l475vg_if.bin
          projectfiles/make_gcc_arm/stm32f103xb_stm32l475vg_if/build/stm32f103xb_stm32l475vg_if_crc.bin
          projectfiles/make_gcc_arm/stm32f103xb_stm32l475vg_if/build/stm32f103xb_stm32l475vg_if_crc.txt
          projectfiles/make_gcc_arm/stm32f103xb_steami32_if/build/stm32f103xb_steami32_if.bin
          projectfiles/make_gcc_arm/stm32f103xb_steami32_if/build/stm32f103xb_steami32_if_crc.bin
          projectfiles/make_gcc_arm/stm32f103xb_steami32_if/build/stm32f103xb_steami32_if_crc.txt
        
    - name: Jeton pour les robots en aval
      id: jeton_aval
      continue-on-error: true   # without a token, warn and let the bots' crons take over
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_SECRET }}
        owner: steamicc
        repositories: arduino-steami-devcontainer,wiki_steami   # the target repositories, comma-separated
        permission-actions: write

    - name: Déclencher les robots en aval
      continue-on-error: true   # a failed trigger never fails the release
      env:
        GH_TOKEN: ${{ steps.jeton_aval.outputs.token }}
        JETON: ${{ steps.jeton_aval.outcome }}
      run: |
        if [ "$JETON" != success ]; then
          echo "::warning::App token unavailable: the downstream bots will run on their cron."
          exit 0
        fi
        # One target per "<repository> <bot>" string; a failed target does not stop the next ones.
        for cible in "arduino-steami-devcontainer suivre-daplink.yml" "wiki_steami suivre-daplink.yml"; do
          read -r repo workflow <<<"$cible"
          gh workflow run "$workflow" -R "steamicc/$repo" \
            || echo "::warning::Bot $workflow of steamicc/$repo not triggered: its cron will take over (check the App's Actions write permission and its installation on this repository)."
        done
